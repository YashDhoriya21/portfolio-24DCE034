server {
    listen 5173;
    server_name localhost;

    # Root directory containing React production build
    root /usr/share/nginx/html;
    index index.html index.htm;

    # SPA routing fallback: send all non-file route requests to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy /auth API requests to backend service inside Docker network
    location /auth/ {
        proxy_pass http://backend:5000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy /tasks API requests to backend service inside Docker network
    location /tasks/ {
        proxy_pass http://backend:5000/tasks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
